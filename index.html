<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Jogos clássicos de jornal no navegador: Sudoku e mais, com temas e partida salva." />
    <title>Jogos de Jornal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231565c0'/%3E%3Cpath d='M11 6v20M21 6v20M6 11h20M6 21h20' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1 id="title">Jogos de Jornal</h1>
        <span id="date" class="date"></span>
        <span class="spacer"></span>
        <button id="hubBtn" class="btn" type="button" hidden>Jogos</button>
        <a id="adminLink" class="btn" href="admin" hidden>Usuários</a>
        <form method="post" action="logout" class="logout"><button class="btn" type="submit">Sair</button></form>
        <div class="themeBox">
          <button id="themeBtn" class="btn" type="button" aria-haspopup="listbox" aria-expanded="false">Tema</button>
          <ul id="themeList" class="themeList" role="listbox" aria-label="Tema" hidden></ul>
        </div>
      </header>

      <main id="main"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
